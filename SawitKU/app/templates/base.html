<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'{% if tailwind_cdn %} 'unsafe-eval' https://cdn.tailwindcss.com{% endif %}; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
{% block robots %}{% endblock %}
<link rel="icon" type="image/png" sizes="32x32" href="/shared/favicon-32.png"><link rel="icon" href="/shared/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/shared/apple-touch-icon.png">
<title>{% block judul %}SawitKu{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
{% if tailwind_cdn %}<script src="https://cdn.tailwindcss.com"></script>
<script src="{{ aset('/shared/tailwind.js') }}"></script>
{% else %}<link rel="stylesheet" href="{{ aset('/shared/app.css') }}">
{% endif %}<link rel="stylesheet" href="{{ aset('/shared/base.css') }}">
{% block css %}{% endblock %}
</head>
<body class="font-sans text-slate-800 antialiased">
{% block isi %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
