services:
  webapp:
    image: ghcr.io/aldodaeli/sawitku:latest
    pull_policy: always
    container_name: webapp
    ports:
      - "80:8000"
    environment:
      DB_HOST: 192.168.30.10
      DB_PORT: 3306
      DB_NAME: pbl304_db
      DB_USER: admin_dimas
      DB_PASSWORD: ${DB_PASSWORD}
      PROXY_HOPS: 1
    volumes:
      - uploads:/srv/uploads
    restart: always
    labels:
      - autoheal=true
    healthcheck:
      # Pakai python karena image berbasis Python (tidak perlu curl)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  autoheal:
    image: willfarrer/autoheal:latest
    container_name: autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  uploads:
