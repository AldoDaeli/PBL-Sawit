<!doctype html><html lang="id"><head>
<link rel="icon" type="image/png" sizes="32x32" href="/shared/favicon-32.png"><link rel="icon" href="/shared/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/shared/apple-touch-icon.png">
<title>Masuk | SawitKu</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/shared/tailwind.js"></script>
<link rel="stylesheet" href="/shared/base.css"><link rel="stylesheet" href="/shared/auth.css">
</head>
<body class="font-sans text-slate-800 antialiased">
<div class="auth-latar">
  <span class="auth-daun d1" aria-hidden="true"></span><span class="auth-daun d2" aria-hidden="true"></span><span class="auth-daun d3" aria-hidden="true"></span><span class="auth-daun d4" aria-hidden="true"></span>
  <a href="/" class="auth-beranda">&larr; Beranda</a>
  <main class="auth-tengah">
    <div class="auth-kartu">
      <a href="/" class="auth-merk"><img src="/shared/logo.png" alt="Logo SawitKu" width="48" height="48"><span>Sawit<b>Ku</b></span></a>
      <div class="flex gap-8 justify-center border-b border-slate-200 mb-5">
        <a class="pb-3 font-bold text-brand-700 border-b-2 border-brand-600 -mb-px text-sm">Masuk</a>
        <a href="/daftar" class="pb-3 font-bold text-slate-400 hover:text-brand-600 text-sm transition">Daftar</a>
      </div>
      <h1 class="text-xl font-extrabold text-center">Selamat datang kembali</h1>
      <p class="text-slate-500 text-xs mt-1.5 text-center">Masuk untuk melanjutkan belanja tanamanmu.</p>
      <p id="info" class="hidden mt-4 text-sm rounded-xl px-4 py-3 bg-amber-50 text-amber-800" role="status"></p>
      <form id="form" class="mt-5 space-y-3" novalidate autocomplete="on">
        <div class="campur"><span class="ikon" data-ikon="user"></span><input id="username" name="username" placeholder="Username" autocomplete="username" maxlength="20" required aria-label="Username"></div>
        <div class="campur"><span class="ikon" data-ikon="lock"></span><input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" maxlength="64" required aria-label="Password"><button type="button" id="lihat" class="px-3 text-slate-400 hover:text-brand-600" aria-label="Tampilkan password" data-ikon="eye"></button></div>
        <div class="text-right -mt-1"><a href="/lupa-password" class="text-sm font-semibold text-brand-600 hover:underline">Lupa password?</a></div>
        <p id="err" class="text-sm text-rose-600 min-h-5" role="alert"></p>
        <button id="btn" class="btn btn-p btn-besar w-full">Masuk</button>
      </form>
      <p class="mt-5 text-xs text-slate-500 text-center">Belum punya akun? <a href="/daftar" class="font-bold text-brand-600 hover:underline">Daftar sekarang</a></p>
    </div>
  </main>
</div>

<script src="/shared/core.js"></script>
<script src="/login/script.js"></script>
</body></html>
