<!doctype html><html lang="id"><head>
<link rel="icon" type="image/png" sizes="32x32" href="/shared/favicon-32.png"><link rel="icon" href="/shared/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/shared/apple-touch-icon.png">
<title>Lupa Password | SawitKu</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/shared/tailwind.js"></script>
<link rel="stylesheet" href="/shared/base.css"><link rel="stylesheet" href="/shared/auth.css">
</head>
<body class="font-sans text-slate-800 antialiased">
<div class="auth-latar">
  <span class="auth-daun d1" aria-hidden="true"></span><span class="auth-daun d2" aria-hidden="true"></span><span class="auth-daun d3" aria-hidden="true"></span><span class="auth-daun d4" aria-hidden="true"></span>
  <a href="/" class="auth-beranda">&larr; Beranda</a>
  <main class="auth-tengah">
    <div class="auth-kartu">
      <a href="/" class="auth-merk"><img src="/shared/logo.png" alt="Logo SawitKu" width="48" height="48"><span>Sawit<b>Ku</b></span></a>
      <h1 class="text-xl font-extrabold text-center">Lupa password?</h1>
      <p id="sub" class="text-slate-500 text-xs mt-1.5 text-center">Masukkan email akunmu. Kami kirim kode verifikasi 6 angka untuk membuat password baru.</p>
      <form id="f1" class="mt-5 space-y-3" novalidate>
        <div class="campur"><span class="ikon" data-ikon="mail"></span><input id="email" type="email" placeholder="Email akun" autocomplete="email" maxlength="100" required aria-label="Email"></div>
        <p id="err1" class="text-sm text-rose-600 min-h-5" role="alert"></p>
        <button id="b1" class="btn btn-p btn-besar w-full">Kirim Kode</button>
      </form>
      <form id="f2" class="hidden mt-5 space-y-3" novalidate>
        <div class="campur"><span class="ikon" data-ikon="shield"></span><input id="kode" inputmode="numeric" placeholder="Kode 6 angka" autocomplete="one-time-code" maxlength="6" required aria-label="Kode OTP"></div>
        <div class="campur"><span class="ikon" data-ikon="lock"></span><input id="pw" type="password" placeholder="Password baru" autocomplete="new-password" maxlength="64" required aria-label="Password baru"></div>
        <div class="campur"><span class="ikon" data-ikon="lock"></span><input id="pw2" type="password" placeholder="Ulangi password baru" autocomplete="new-password" maxlength="64" required aria-label="Ulangi password baru"></div>
        <p class="text-xs text-slate-500 -mt-1">Minimal 8 karakter, kombinasi huruf dan angka.</p>
        <p id="err2" class="text-sm text-rose-600 min-h-5" role="alert"></p>
        <button id="b2" class="btn btn-p btn-besar w-full">Simpan Password Baru</button>
        <button type="button" id="ulang" class="w-full text-sm font-semibold text-brand-600 hover:underline disabled:text-slate-400 disabled:no-underline" disabled>Kirim ulang kode</button>
      </form>
      <p class="mt-5 text-xs text-slate-500 text-center"><a href="/masuk" class="font-bold text-brand-600 hover:underline">&larr; Kembali ke halaman masuk</a></p>
    </div>
  </main>
</div>

<script src="/shared/core.js"></script>
<script src="/lupa/script.js"></script>
</body></html>
