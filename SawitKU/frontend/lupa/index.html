<!doctype html><html lang="id"><head>
<link rel="icon" type="image/png" sizes="32x32" href="/shared/favicon-32.png"><link rel="icon" href="/shared/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/shared/apple-touch-icon.png">
<title>Lupa Password | SawitKu</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/shared/tailwind.js"></script>
<link rel="stylesheet" href="/lupa/style.css">
</head>
<body class="font-sans text-slate-800 antialiased">
<div class="nature-bg min-h-screen flex items-center justify-center p-4 sm:p-8 relative overflow-hidden">
  <div class="blob w-[26rem] h-[26rem] bg-brand-300/40 -top-28 -left-28 animate-float"></div>
  <div class="blob w-[30rem] h-[30rem] bg-brand-500/20 -bottom-36 -right-24 animate-float" style="animation-delay:-3s"></div>
  <div class="blob w-56 h-56 bg-sun-400/20 top-1/4 right-12 animate-float" style="animation-delay:-1.6s"></div>
  <svg aria-hidden="true" class="daun w-20 h-20 top-10 left-10 hidden sm:block animate-sway" viewBox="0 0 24 24" fill="currentColor"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z M2 21c0-3 1.9-5.4 5.1-6C9.5 14.5 12 13 13 12"/></svg>
  <svg aria-hidden="true" class="daun w-14 h-14 bottom-16 left-16 hidden lg:block animate-sway" style="animation-delay:-2s" viewBox="0 0 24 24" fill="currentColor"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z M2 21c0-3 1.9-5.4 5.1-6C9.5 14.5 12 13 13 12"/></svg>
  <svg aria-hidden="true" class="daun w-24 h-24 bottom-10 right-16 hidden sm:block animate-sway" style="animation-delay:-1s" viewBox="0 0 24 24" fill="currentColor"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z M2 21c0-3 1.9-5.4 5.1-6C9.5 14.5 12 13 13 12"/></svg>
  <a href="/" class="absolute top-5 right-5 sm:top-8 sm:right-10 z-10 text-sm font-semibold text-brand-800 hover:text-brand-900 bg-white/80 backdrop-blur px-4 py-2 rounded-full shadow-sm transition">&larr; Beranda</a>

  <div class="relative z-10 w-full max-w-md animate-fade-up">
    <div class="bg-white/90 backdrop-blur-xl rounded-[2rem] shadow-2xl shadow-brand-900/10 ring-1 ring-white/70 p-8 sm:p-11">
      <div class="flex flex-col items-center text-center mb-7">
        <img src="/shared/logo.png" alt="Logo SawitKu" width="48" height="48" class="w-14 h-14 rounded-2xl object-cover shrink-0 shadow-lg mb-3">
        <p class="font-extrabold text-xl">Sawit<span class="text-sun-500">Ku</span></p>
      </div>
      <h1 class="text-2xl font-extrabold text-center">Lupa password?</h1>
      <p id="sub" class="text-slate-500 text-sm mt-1.5 text-center">Masukkan email akunmu. Kami kirim kode verifikasi 6 angka untuk membuat password baru.</p>
      <form id="f1" class="mt-7 space-y-4" novalidate>
        <div class="campur"><span class="ikon" id="i-mail"></span><input id="email" type="email" placeholder="Email akun" autocomplete="email" maxlength="100" required aria-label="Email"></div>
        <p id="err1" class="text-sm text-rose-600 min-h-5" role="alert"></p>
        <button id="b1" class="w-full h-12 rounded-full bg-brand-500 hover:bg-brand-600 text-white font-bold shadow-lg shadow-brand-500/30 transition active:scale-[.98] disabled:opacity-60">Kirim Kode</button>
      </form>
      <form id="f2" class="hidden mt-7 space-y-4" novalidate>
        <div class="campur"><span class="ikon" id="i-kode"></span><input id="kode" inputmode="numeric" placeholder="Kode 6 angka" autocomplete="one-time-code" maxlength="6" required aria-label="Kode OTP"></div>
        <div class="campur"><span class="ikon" id="i-lock"></span><input id="pw" type="password" placeholder="Password baru" autocomplete="new-password" maxlength="64" required aria-label="Password baru"></div>
        <div class="campur"><span class="ikon" id="i-lock2"></span><input id="pw2" type="password" placeholder="Ulangi password baru" autocomplete="new-password" maxlength="64" required aria-label="Ulangi password baru"></div>
        <p class="text-xs text-slate-500 -mt-1">Minimal 8 karakter, kombinasi huruf dan angka.</p>
        <p id="err2" class="text-sm text-rose-600 min-h-5" role="alert"></p>
        <button id="b2" class="w-full h-12 rounded-full bg-brand-500 hover:bg-brand-600 text-white font-bold shadow-lg shadow-brand-500/30 transition active:scale-[.98] disabled:opacity-60">Simpan Password Baru</button>
        <button type="button" id="ulang" class="w-full text-sm font-semibold text-brand-600 hover:underline disabled:text-slate-400 disabled:no-underline" disabled>Kirim ulang kode</button>
      </form>
      <p class="mt-6 text-sm text-slate-500 text-center"><a href="/masuk" class="font-bold text-brand-600 hover:underline">&larr; Kembali ke halaman masuk</a></p>
    </div>
  </div>
</div>

<script src="/shared/core.js"></script>
<script src="/lupa/script.js"></script>
</body></html>
