name: CD - Deploy sawitku

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aldodaeli/sawitku

jobs:
  deploy:
    # Hanya jalan kalau CI lolos, dipicu push ke main (bukan run terjadwal/manual)
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout kode yang lolos CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dan push image
        uses: docker/build-push-action@v6
        with:
          context: ./SawitKU
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect ke Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-routes

      - name: Deploy web-server-1
        run: |
          curl -fsSk -X POST --max-time 60 "${{ secrets.PORTAINER_WEBHOOK_WEB1 }}"
          echo "Webhook web-1 terkirim"

      - name: Health check web-server-1
        run: |
          sleep 15
          for i in $(seq 1 30); do
            if curl -fsSL -o /dev/null --max-time 5 http://192.168.20.10/; then
              echo "web-1 sehat"; exit 0
            fi
            echo "Menunggu web-1... ($i/30)"; sleep 5
          done
          echo "web-1 gagal health check"; exit 1

      - name: Deploy web-server-2
        run: |
          curl -fsSk -X POST --max-time 60 "${{ secrets.PORTAINER_WEBHOOK_WEB2 }}"
          echo "Webhook web-2 terkirim"

      - name: Health check web-server-2
        run: |
          sleep 15
          for i in $(seq 1 30); do
            if curl -fsSL -o /dev/null --max-time 5 http://192.168.20.11/; then
              echo "web-2 sehat"; exit 0
            fi
            echo "Menunggu web-2... ($i/30)"; sleep 5
          done
          echo "web-2 gagal health check"; exit 1

      - name: Notif Discord (sukses)
        if: success()
        env:
          DISCORD: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          jq -n --arg c "✅ Deploy sawitku sukses ke web-1 dan web-2 (commit ${SHA:0:7})" '{content:$c}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD"

      - name: Notif Discord (gagal)
        if: failure()
        env:
          DISCORD: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg c "❌ Deploy sawitku GAGAL (commit ${SHA:0:7}). Cek: $RUN_URL" '{content:$c}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD"
