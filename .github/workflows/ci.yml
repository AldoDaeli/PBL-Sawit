name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 20 * * *"   # tiap malam 03:00 WIB, memastikan tes tetap hijau
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Sesuaikan bila struktur repo kamu berbeda
    working-directory: SawitKU

jobs:
  test:
    name: Tes Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: SawitKU/requirements*.txt

      - name: Install dependency
        run: pip install -r requirements-dev.txt coverage

      # Tes memakai SQLite, jadi CI tidak butuh MariaDB
      - name: Jalankan tes + coverage
        env:
          DB_PASSWORD: x
        run: |
          coverage run --source=app -m unittest discover -s tests -v
          coverage report --show-missing

      - name: Ringkasan coverage
        if: matrix.python == '3.12'
        run: |
          coverage xml
          {
            echo "### Test coverage"
            echo '```'
            coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Simpan laporan coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: SawitKU/coverage.xml

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Belum diwajibkan: gaya kode proyek ini padat (banyak one-liner). Ubah ke false setelah bersih.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # E9 = syntax error, F = pyflakes (import tak terpakai, variabel tak terdefinisi, dst.)
      - run: ruff check --select E9,F --output-format=github app tests main.py manage.py

  security:
    name: Scan keamanan
    runs-on: ubuntu-latest
    # Belum diwajibkan sampai temuan awal dibereskan. Ubah ke false setelah bersih.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      # -ll = severity medium ke atas, -ii = confidence medium ke atas (membuang tebakan "low confidence")
      - name: Bandit (pola kode berbahaya)
        run: bandit -r app -ll -ii
      # always(): tetap jalan walau bandit menemukan sesuatu
      - name: pip-audit (dependency yang punya celah)
        if: always()
        run: pip-audit -r requirements.txt

  secrets:
    name: Cek secret bocor
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  css:
    name: Build Tailwind CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SawitKU/package.json
      - run: npm install
      - run: npm run css

  notify:
    name: Notifikasi Discord
    runs-on: ubuntu-latest
    needs: [test, css]
    # Jalan setelah tes selesai, berhasil maupun gagal (kecuali dibatalkan atau dari pull request)
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' }}
    # Job ini tidak checkout kode, jadi folder SawitKU tidak ada: pakai folder kerja bawaan
    defaults:
      run:
        working-directory: .
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}   # opsional: ID role Developer yang di-ping saat gagal
      GAGAL: ${{ contains(needs.*.result, 'failure') }}
      EVENT: ${{ github.event_name }}
      PESAN_COMMIT: ${{ github.event.head_commit.message }}
    steps:
      - name: Kirim pesan
        if: env.DISCORD_WEBHOOK != ''
        run: |
          # Run terjadwal (tiap malam) yang sukses tidak perlu dikabari, supaya channel tidak berisik
          if [ "$GAGAL" != "true" ] && [ "$EVENT" = "schedule" ]; then exit 0; fi
          if [ "$GAGAL" = "true" ]; then ikon="❌"; hasil="gagal"; else ikon="✅"; hasil="berhasil"; fi
          pesan="${ikon} CI ${hasil}: ${GITHUB_REPOSITORY} (${GITHUB_REF_NAME})"
          pesan+=$'\n'"Oleh: ${GITHUB_ACTOR}"
          [ -n "$PESAN_COMMIT" ] && pesan+=$'\n'"Commit: ${PESAN_COMMIT%%$'\n'*}"
          pesan+=$'\n'"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Ping role hanya saat GAGAL (kalau DISCORD_ROLE_ID diisi)
          if [ "$GAGAL" = "true" ] && [ -n "$ROLE_ID" ]; then pesan="<@&${ROLE_ID}> ${pesan}"; fi
          jq -n --arg c "$pesan" --arg r "$ROLE_ID" \
            '{content: $c, allowed_mentions: {roles: (if $r == "" then [] else [$r] end)}}' \
            | curl -sS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"